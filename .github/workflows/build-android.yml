name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Fetch logo from chaloje.com (if no icon provided)
        continue-on-error: true
        run: |
          mkdir -p resources
          if [ ! -f resources/icon.png ]; then
            curl -fsSL -A "Mozilla/5.0" -o /tmp/logo.png https://chaloje.com/assets/admin/images/adaptive-icon.png
            file /tmp/logo.png
            pip install --quiet pillow
            python3 - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/logo.png').convert('RGBA')
          print('logo size:', src.size)
          def place(canvas, box):
              img = src.copy(); img.thumbnail((box, box), Image.LANCZOS)
              bg = Image.new('RGB', (canvas, canvas), 'white')
              bg.paste(img, ((canvas - img.width)//2, (canvas - img.height)//2), img)
              return bg
          place(1024, 1024).save('resources/icon.png')
          place(2732, 1000).save('resources/splash.png')
          place(2732, 1000).save('resources/splash-dark.png')
          PY
            ls -l resources
          fi

      - name: Generate icon and splash (if provided)
        run: |
          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          else
            echo "No resources/icon.png found - using default icon"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chaloje-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chaloje.apk

      - name: Publish as release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Chaloje App (latest)
          body: Tap Chaloje.apk below to download, then open it to install.
          make_latest: true
          files: |
            Chaloje.apk
            resources/icon.png
