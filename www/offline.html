<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>No connection</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
           justify-content:center; text-align:center; padding:24px; box-sizing:border-box;
           font-family:-apple-system, Roboto, sans-serif; background:#fff; color:#222; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#666; margin:0 0 24px; max-width:300px; line-height:1.4; }
    button { background:#0a66c2; color:#fff; border:0; border-radius:8px; padding:12px 28px;
             font-size:16px; }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>Chaloje needs an internet connection to search and book flights. Check your connection and try again.</p>
  <button onclick="location.href='https://chaloje.com'">Try again</button>
</body>
</html>
